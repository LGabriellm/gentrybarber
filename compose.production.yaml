# Production stack. The deploy passes /opt/barber-platform/.env.production explicitly.
# Deploy only CI-built images loaded from the verified release artifact.
name: barber-platform-prod

x-backend-environment: &backend-environment
  NODE_ENV: production
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?Set PLATFORM_DOMAIN}
  PLATFORM_NAME: ${PLATFORM_NAME:-BarberHub}
  DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD:?}@postgres:5432/platform
  REDIS_URL: redis://redis:6379
  BIND_HOST: 0.0.0.0
  API_PORT: 4000
  SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-platform}
  RATE_LIMIT_NAMESPACE: ${RATE_LIMIT_NAMESPACE:-platform:http:}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
  # deploy.sh discovers the exact Docker gateway /32 before starting the API.
  TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
  NOTIFICATIONS_MODE: live

x-frontend: &frontend
  init: true
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M
  environment:
    API_URL: http://api:4000
    ADMIN_URL: ${ADMIN_URL:-}
    PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?Set PLATFORM_DOMAIN}
    PLATFORM_NAME: ${PLATFORM_NAME:-BarberHub}

services:
  # ── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    # No ports exposed — only reachable from the Docker network.

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  # ── Backend ─────────────────────────────────────────────────────
  migrate:
    image: barber-platform-api:${RELEASE_ID:?Set RELEASE_ID from the verified release}
    pull_policy: never
    init: true
    environment:
      <<: *backend-environment
    command: ['pnpm', 'db:migrate']
    restart: 'no'
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: barber-platform-api:${RELEASE_ID:?Set RELEASE_ID from the verified release}
    pull_policy: never
    init: true
    environment:
      <<: *backend-environment
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate with at least 32 random characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?Set TRUSTED_ORIGINS}
    # Host-only ingress. Internet traffic must pass through Caddy on 80/443.
    ports: ['127.0.0.1:${API_HOST_PORT:-4000}:4000']
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: barber-platform-worker:${RELEASE_ID:?Set RELEASE_ID from the verified release}
    pull_policy: never
    init: true
    environment: *backend-environment
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ── Frontends ───────────────────────────────────────────────────
  web-public:
    <<: *frontend
    image: barber-platform-web-public:${RELEASE_ID:?Set RELEASE_ID from the verified release}
    pull_policy: never
    ports: ['127.0.0.1:${WEB_PUBLIC_HOST_PORT:-3000}:3000']
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    <<: *frontend
    image: barber-platform-dashboard:${RELEASE_ID:?Set RELEASE_ID from the verified release}
    pull_policy: never
    ports: ['127.0.0.1:${DASHBOARD_HOST_PORT:-3001}:3000']
    depends_on:
      api:
        condition: service_healthy

  admin:
    <<: *frontend
    image: barber-platform-admin:${RELEASE_ID:?Set RELEASE_ID from the verified release}
    pull_policy: never
    ports: ['127.0.0.1:${ADMIN_HOST_PORT:-3002}:3000']
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
