name: Deploy to VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Foundation CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 45
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          # Host fingerprints are public. Pinning the exact ECDSA key here
          # avoids whitespace/line-break corruption in repository secrets.
          fingerprint: SHA256:3jznb3JdQinBPNtXDIMgOq+Y5tZgB3v6t3/hRp6Kyrg
          protocol: tcp4
          port: 22
          command_timeout: 40m
          script: |
            set -euo pipefail
            
            # Trust the directory to prevent dubious ownership error
            git config --global --add safe.directory /opt/barber-platform
            
            # Initial Setup checks
            if [ ! -d "/opt/barber-platform" ]; then
              echo "==> First time deployment detected! Cloning repository..."
              git clone https://github.com/LGabriellm/gentrybarber.git /opt/barber-platform
            fi
            
            cd /opt/barber-platform
            git fetch origin main
            git reset --hard origin/main
            
            # Run setup only on first deploy (it's already done on this VPS)
            if [ ! -f /opt/.barber-setup-done ]; then
              bash infra/vps/setup-vps.sh || echo "⚠ Some setup steps failed, but continuing..."
              touch /opt/.barber-setup-done
            fi
            
            # Run normal deployment
            bash infra/vps/deploy.sh

      - name: Verify deployment externally
        env:
          PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$PLATFORM_DOMAIN" || { echo "::error::Set the PLATFORM_DOMAIN repository variable"; exit 1; }
          sleep 10
          curl --fail --silent --show-error --max-time 30 --resolve "api.$PLATFORM_DOMAIN:443:$VPS_HOST" "https://api.$PLATFORM_DOMAIN/health" || {
            echo "⚠ API health check failed after deploy"
            exit 1
          }
          curl --fail --silent --show-error --max-time 30 --resolve "dashboard.$PLATFORM_DOMAIN:443:$VPS_HOST" "https://dashboard.$PLATFORM_DOMAIN/api/health" > /dev/null
          curl --fail --silent --show-error --max-time 30 --resolve "admin.$PLATFORM_DOMAIN:443:$VPS_HOST" "https://admin.$PLATFORM_DOMAIN/api/health" > /dev/null
          if curl --fail --silent --max-time 5 "http://$VPS_HOST:4000/health" > /dev/null 2>&1; then
            echo "::error::API port 4000 is exposed publicly"
            exit 1
          fi
          echo "✓ HTTPS ingress is healthy and the direct API port is closed"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deployment to VPS failed! Check the deploy logs on the server."
          echo "SSH into the VPS and run: docker compose --env-file .env.production -f compose.production.yaml logs --tail 100"
