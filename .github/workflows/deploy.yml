name: Deploy to VPS

on:
  workflow_run:
    workflows: ['Foundation CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/barber-platform
            bash infra/vps/deploy.sh

      - name: Verify deployment externally
        run: |
          sleep 10
          curl --fail --silent --max-time 30 "http://${{ secrets.VPS_HOST }}:4000/ready" || {
            echo "⚠ API health check failed after deploy"
            exit 1
          }
          echo "✓ API is healthy after deploy"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deployment to VPS failed! Check the deploy logs on the server."
          echo "SSH into the VPS and run: docker compose -f compose.production.yaml logs --tail 100"
