name: Deploy to VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Foundation CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            
            # Initial Setup (First Run Only)
            if [ ! -d "/opt/barber-platform" ]; then
              echo "==> First time deployment detected! Setting up VPS..."
              
              # 1. Clone repository
              git clone https://github.com/LGabriellm/gentrybarber.git /opt/barber-platform
              cd /opt/barber-platform
              
              # 2. Run the setup script (installs docker, caddy, swap, etc)
              bash infra/vps/setup-vps.sh || echo "⚠ Some setup steps failed, but continuing..."
              
              # 3. Create .env.production
              cp .env.production.example .env.production
              
              # Generate real secrets for the environment
              DB_PASS=$(openssl rand -hex 16)
              AUTH_SECRET=$(openssl rand -hex 32)
              sed -i "s/CHANGE_ME_STRONG_PASSWORD_HERE/$DB_PASS/g" .env.production
              sed -i "s/CHANGE_ME_AT_LEAST_32_CHARS/$AUTH_SECRET/g" .env.production
              
              echo "==> Initial setup completed successfully."
            else
              cd /opt/barber-platform
            fi
            
            # Trust the directory to prevent dubious ownership error
            git config --global --add safe.directory /opt/barber-platform
            
            # Run normal deployment
            bash infra/vps/deploy.sh

      - name: Verify deployment externally
        run: |
          sleep 10
          curl --fail --silent --max-time 30 "http://${{ secrets.VPS_HOST }}:4000/ready" || {
            echo "⚠ API health check failed after deploy"
            exit 1
          }
          echo "✓ API is healthy after deploy"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deployment to VPS failed! Check the deploy logs on the server."
          echo "SSH into the VPS and run: docker compose -f compose.production.yaml logs --tail 100"
