name: barber-platform
# Local stack. For host-based development, start only postgres redis minio mailpit.
x-backend-environment: &backend-environment
  NODE_ENV: development
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://platform:${POSTGRES_PASSWORD}@postgres:5432/platform}
  REDIS_URL: redis://redis:6379
  BIND_HOST: 0.0.0.0
  API_PORT: 4000
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_USER: ''
  SMTP_PASSWORD: ''
  SMTP_FROM: ${SMTP_FROM:-Platform <noreply@localhost>}
  S3_ENDPOINT: http://minio:9000
x-frontend: &frontend
  init: true
  restart: unless-stopped
  environment:
    API_URL: http://api:4000
    PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
    PLATFORM_NAME: ${PLATFORM_NAME:-BarberHub}
  depends_on:
    api:
      condition: service_healthy
services:
  migrate:
    image: barber-platform-api:local
    build:
      context: .
      target: runtime
      args: { APP: api }
    init: true
    env_file: .env
    environment: *backend-environment
    working_dir: /workspace
    command: ['pnpm', 'db:migrate']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: barber-platform-api:local
    build:
      context: .
      target: runtime
      args: { APP: api }
    init: true
    env_file: .env
    environment:
      <<: *backend-environment
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate BETTER_AUTH_SECRET with at least 32 characters in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3001,http://localhost:3002}
    ports: ['127.0.0.1:4000:4000']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
  worker:
    build:
      context: .
      target: runtime
      args: { APP: worker }
    init: true
    env_file: .env
    environment: *backend-environment
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
  web-public:
    <<: *frontend
    build:
      context: .
      target: frontend
      args: { APP: web-public }
    ports: ['127.0.0.1:3000:3000']
  dashboard:
    <<: *frontend
    build:
      context: .
      target: frontend
      args: { APP: dashboard }
    ports: ['127.0.0.1:3001:3000']
  admin:
    <<: *frontend
    build:
      context: .
      target: frontend
      args: { APP: admin }
    ports: ['127.0.0.1:3002:3000']
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: platform
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  postgres-data:
  redis-data:
  minio-data:
